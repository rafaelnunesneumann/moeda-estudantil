# ============================================================
# Datasource - PostgreSQL
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/moeda_estudantil
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Aplicacao
# ============================================================
spring.application.name=moeda-estudantil
server.port=8080

# ============================================================
# JWT
# ============================================================
jwt.secret=dGhpcyBpcyBhIHNlY3VyZSBrZXkgZm9yIG1vZWRhIGVzdHVkYW50aWwgand0
jwt.expiration=86400000

# ============================================================
# Kafka
# Local: Redpanda via Docker (sem autenticacao)
# Producao: Confluent Cloud (via variaveis de ambiente no Render)
# ============================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}

# ============================================================
# Email / SMTP (Gmail)
# Credenciais ficam em application-secrets.properties (nao commitado)
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:}

# Importa credenciais locais se o arquivo existir (nao commitado)
spring.config.import=optional:classpath:application-secrets.properties
